[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automate"
version = "0.1.0"
description = "Multi-broker SEBI-compliant options trading bot — backtest, paper, and live."
requires-python = ">=3.11"
# Actual runtime dependencies are pinned in requirements.txt (pip install
# -r requirements.txt), not duplicated here — this file exists only to
# make `automate` (src/automate/) importable as a real package via
# `pip install -e .`, matching how every internal module now imports
# (`from automate.config import ...` etc.) instead of relying on sys.path
# hacks or always running from the exact repo-root directory.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends()-in-default-argument pattern
    "E402",    # deferred/local imports are a deliberate pattern here (circular-import avoidance)
    "RUF001",  # intentional prose typography (₹, – en-dash) — not typos
    "RUF002",
    "RUF003",
    "RUF012",  # these are all static, never-instantiated config/lookup classes
]

[tool.ruff.lint.isort]
known-first-party = ["automate"]
